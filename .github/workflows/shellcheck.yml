name: Shellcheck

# scripts/*.sh는 비개발자 사용자가 온보딩 시 그대로 실행하는 진입점(setup.sh 등)이다.
# check-environment-dry-run.yml이 "실제로 실행됐을 때 동작하는가"(행위)를 검증한다면,
# 이 워크플로는 실행 전 정적 분석으로 조건 분기 미실행 케이스의 버그까지 잡아낸다.
#
# ubuntu-latest 러너에 shellcheck가 기본 설치되어 있어 별도 action 없이 바로 사용한다.

on:
  pull_request:
    paths:
      - "scripts/*.sh"
  push:
    branches: [main]
    paths:
      - "scripts/*.sh"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

name: Shellcheck

# scripts/*.sh는 팀원이 온보딩 시 그대로 실행하는 진입점(setup_team_member.sh 등)이다.
# 이 워크플로는 실행 전 정적 분석으로 조건 분기 미실행 케이스의 버그까지 잡아낸다.
# (스크립트는 Windows Git Bash에서 실행되므로 실제 실행 검증은 CI가 아니라 팀원 환경에서 이루어진다.)
#
# ubuntu-latest 러너에 shellcheck가 기본 설치되어 있어 별도 action 없이 바로 사용한다.

on:
  pull_request:
    paths:
      - "scripts/*.sh"
  push:
    branches: [main]
    paths:
      - "scripts/*.sh"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck scripts/*.sh
